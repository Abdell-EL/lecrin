<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#BDBAB5">
<title>L'Écrin Nail Bar — Réserver</title>
<meta name="description" content="Manucure, pédicure et beauté du regard aux Princesses, Casablanca. Réservez votre moment en moins d'une minute.">
<meta property="og:title" content="L'Écrin Nail Bar — Réservez votre moment">
<meta property="og:description" content="Manucure, pédicure, beauté du regard. Les Princesses, Casablanca.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://abdell-el.github.io/lecrin/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --stone:#EFE7DE;
  --paper:#F7F2EC;
  --ink:#2B1214;
  --muted:#7C6560;
  --faint:#A8938C;
  --line:#D9CBBF;
  --ox:#5A161B;
  --ox-deep:#340B0E;
  --ox-hi:#7A2028;
  --cream:#F4E4DA;
  --ease:cubic-bezier(.2,.75,.2,1);
  --polish:#4A2318;
  --tvw:min(250px,64vw);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--stone);color:var(--ink);font-family:Jost,system-ui,sans-serif;font-size:16px;line-height:1.55;padding-bottom:110px;overflow-x:hidden}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ox);outline-offset:3px;border-radius:3px}
.wrap{max-width:560px;margin:0 auto;padding:0 20px}

/* =================== STAGE: brushed steel, window light =================== */
.stage{position:relative;min-height:100svh;padding:74px 20px 36px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;isolation:isolate;
  background:
    repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px),
    radial-gradient(120% 70% at 50% 100%,#E4E1DC 0%,transparent 60%),
    linear-gradient(180deg,#C9C6C1 0%,#B5B2AD 55%,#A29F9A 78%,#CFCCC7 100%)}
.light{position:absolute;inset:-20% -40%;z-index:-1;pointer-events:none;filter:blur(14px);opacity:.55;
  background:linear-gradient(118deg,transparent 0 22%,rgba(70,58,52,.35) 24% 31%,transparent 33% 47%,rgba(70,58,52,.3) 49% 56%,transparent 58% 72%,rgba(70,58,52,.25) 74% 80%,transparent 82%);
  animation:sun 26s ease-in-out infinite alternate}
@keyframes sun{from{transform:translateX(-6%)}to{transform:translateX(6%)}}
.floor{position:absolute;left:0;right:0;bottom:0;height:30%;z-index:-1;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.25));border-top:1px solid rgba(255,255,255,.35)}

.topbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:18px 20px;z-index:3}
.topbar small{font-size:.8125rem;color:#3E3633}
.lang{display:flex;border:1px solid rgba(43,18,20,.25);border-radius:20px;padding:3px;gap:2px;background:rgba(255,255,255,.2)}
.lang button{background:none;border:0;padding:4px 11px;font-size:.8125rem;cursor:pointer;color:#4E4542;border-radius:16px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--cream)}

/* =================== TVs =================== */
.stack{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;will-change:transform}
.stack::after{content:"";position:absolute;left:-6%;right:-6%;bottom:-16px;height:26px;border-radius:50%;background:radial-gradient(closest-side,rgba(30,20,18,.45),transparent);z-index:-1}
.tv{width:var(--tvw);position:relative;opacity:0;transform:translateY(18px)}
.ready .tv{animation:place .8s var(--ease) forwards}
.ready .tv:nth-child(3){animation-delay:.05s}.ready .tv:nth-child(2){animation-delay:.18s}.ready .tv:nth-child(1){animation-delay:.31s}
@keyframes place{to{opacity:1;transform:none}}
.cab{display:flex;align-items:stretch;gap:5%;padding:6.5% 5.5% 6.5% 6%;border-radius:12px;
  background:linear-gradient(180deg,#2C221D,#17110E 70%,#0F0B09);
  box-shadow:0 0 0 2px #B9B5AF,0 0 0 3px #6E6A65,inset 0 1px 0 rgba(255,255,255,.12),inset 0 -2px 6px rgba(0,0,0,.6),0 12px 22px -6px rgba(0,0,0,.45)}
.cab::before{content:"";position:absolute;left:3%;right:3%;top:2px;height:40%;border-radius:10px 10px 50% 50%/10px 10px 20% 20%;background:linear-gradient(180deg,rgba(255,255,255,.08),transparent);pointer-events:none}
.screen{position:relative;flex:0 0 74%;aspect-ratio:1.36;border-radius:18%/22%;overflow:hidden;background:#0D0706;border:0;padding:0;display:block;
  box-shadow:0 0 0 3px #090605,0 0 0 4px #3A322D}
button.screen{cursor:pointer}
.tube{position:absolute;inset:0;transform:scale(0,.004);filter:brightness(3)}
.tv.on .tube{animation:power 1.05s var(--ease) forwards}
@keyframes power{0%{transform:scale(0,.004);filter:brightness(5)}30%{transform:scale(1,.006);filter:brightness(5)}62%{transform:scale(1,1);filter:brightness(1.9)}100%{transform:scale(1,1);filter:brightness(1)}}
.pic{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--cream);opacity:0;transition:opacity .01s .12s;
  background:radial-gradient(ellipse at 50% 42%,#922C31 0%,#5A161B 55%,#2E090B 100%)}
.pic.active{opacity:1}
.pic .logo{font-family:Cormorant,serif;font-weight:500;letter-spacing:.22em;font-size:clamp(1.05rem,5.2vw,1.4rem);padding-left:.22em;line-height:1}
.pic .sub{font-size:.5rem;letter-spacing:.3em;padding-left:.3em;margin-top:6px;opacity:.8}
.pic .it{font-family:Cormorant,serif;font-style:italic;font-size:clamp(1.1rem,5.4vw,1.5rem);line-height:1.05}
.pic .small{font-size:.625rem;opacity:.8;margin-top:6px}
.pic.tiles{background-color:#5A161B;background-image:
  linear-gradient(115deg,rgba(255,255,255,.18) 0 16%,transparent 30%),
  repeating-linear-gradient(90deg,transparent 0 15px,#2A0709 15px 16px),
  repeating-linear-gradient(0deg,transparent 0 27px,#2A0709 27px 28px),
  radial-gradient(ellipse at 50% 40%,#8A2A2F,#4A1115);
  background-size:16px 28px,auto,auto,auto}
.pic.shadech{background:radial-gradient(ellipse at 35% 30%,rgba(255,255,255,.35),transparent 40%),var(--polish);transition:opacity .01s .12s,background-color .6s}
.pic.menu .it{font-size:clamp(.95rem,4.6vw,1.25rem);line-height:1.25}
.live{display:flex;align-items:center;gap:6px;font-size:.625rem;margin-top:8px;opacity:.9}
.live i{width:6px;height:6px;border-radius:50%;background:#FF6B5E;animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}
.screen::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px);mix-blend-mode:multiply;animation:flick 4s infinite}
@keyframes flick{0%,100%{opacity:.9}47%{opacity:.9}48%{opacity:.6}49%{opacity:.95}}
.screen::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;border-radius:inherit;
  background:radial-gradient(ellipse 70% 50% at 28% 18%,rgba(255,255,255,.22),transparent 60%),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
.static{position:absolute;inset:0;width:100%;height:100%;z-index:1;opacity:0;image-rendering:pixelated;pointer-events:none}
.panel{flex:1;display:flex;flex-direction:column;align-items:center;gap:9%;padding-top:2%}
.knob{width:clamp(17px,6.4vw,23px);aspect-ratio:1;border-radius:50%;border:0;position:relative;flex:none;
  background:radial-gradient(circle at 38% 32%,#F4F1EC,#A9A59F 52%,#55524E);box-shadow:0 2px 2px rgba(0,0,0,.6),inset 0 -1px 1px rgba(0,0,0,.3);
  transform:rotate(var(--r,0deg));transition:transform .35s var(--ease)}
button.knob{cursor:pointer}
.knob::after{content:"";position:absolute;left:50%;top:10%;width:2px;height:36%;background:#2A2725;border-radius:1px;transform:translateX(-50%)}
.grille{flex:1;width:72%;border-radius:2px;background:repeating-linear-gradient(0deg,#0B0807 0 2px,#3A312B 2px 3px);box-shadow:inset 0 0 3px rgba(0,0,0,.8)}
.feet{display:flex;justify-content:space-between;padding:0 14%;height:5px}
.feet i{width:16%;height:5px;background:linear-gradient(#5E5A55,#2C2926);border-radius:0 0 2px 2px}

.hero-copy{text-align:center;margin-top:34px;opacity:0;transform:translateY(10px)}
.powered .hero-copy{animation:place .9s var(--ease) .2s forwards}
.hero-copy h1{font-family:Cormorant,serif;font-style:italic;font-weight:400;font-size:clamp(2.5rem,10.5vw,3.3rem);line-height:1;color:var(--ink)}
.hero-copy p{margin:10px auto 0;color:#4E4542;max-width:31ch;font-size:.9375rem}

/* =================== content =================== */
.facts{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.facts div{padding:18px 0 16px;font-size:.8125rem;color:var(--muted);line-height:1.3}
.facts div+div{padding-left:14px;border-left:1px solid var(--line)}
.facts b{display:block;color:var(--ink);font-weight:500;font-size:.9375rem;margin-bottom:2px}

section{margin-top:50px;scroll-margin-top:20px}
h2{font-family:Cormorant,serif;font-weight:500;font-size:2rem;line-height:1.1;display:flex;gap:14px;align-items:baseline;margin-bottom:16px}
h2 .n{font-family:Jost,sans-serif;font-size:.75rem;color:var(--ox-hi);font-weight:500;flex:none;font-variant-numeric:tabular-nums}

.cats{position:relative;display:inline-flex;padding:3px;border:1px solid var(--line);border-radius:22px;background:var(--paper)}
.cats .pill{position:absolute;top:3px;bottom:3px;left:0;border-radius:18px;background:var(--ox);transition:transform .45s var(--ease),width .45s var(--ease);z-index:0}
.cat{position:relative;z-index:1;padding:7px 15px;border:0;border-radius:18px;background:none;cursor:pointer;font-size:.875rem;color:var(--muted);transition:color .3s}
.cat[aria-pressed="true"]{color:var(--cream)}

.list{border-top:1px solid var(--line);margin-top:16px}
.svc{position:relative;width:100%;display:grid;grid-template-columns:1fr auto;gap:2px 12px;text-align:left;padding:17px 4px;background:none;border:0;border-bottom:1px solid var(--line);cursor:pointer;transition:padding .35s var(--ease),background .35s}
.svc .t{font-family:Cormorant,serif;font-weight:600;font-size:1.3rem;line-height:1.2}
.svc .d{color:var(--muted);font-size:.875rem;grid-column:1}
.svc .p{grid-row:1/3;grid-column:2;align-self:center;font-size:.9375rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.svc .p small{font-size:.75rem;color:var(--muted);margin-left:3px}
.svc::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:2px;background:var(--ox);transform:scaleY(0);transition:transform .35s var(--ease)}
.svc[aria-pressed="true"]{background:var(--paper);padding-left:16px}
.svc[aria-pressed="true"]::before{transform:scaleY(1)}
.list.anim .svc{animation:slide .4s var(--ease) both}
@keyframes slide{from{opacity:0;transform:translateX(14px)}}
.note{color:var(--faint);font-size:.8125rem;margin-top:10px}

/* =================== shade: fingertips =================== */
.shade{display:grid;grid-template-rows:0fr;transition:grid-template-rows .55s var(--ease)}
.shade>div{overflow:hidden}
.shade.on{grid-template-rows:1fr}
.studio{position:relative;height:190px;overflow:hidden;border:1px solid var(--line);border-bottom:0;border-radius:6px 6px 0 0;
  background:radial-gradient(90% 80% at 50% 0%,#FBF7F2,#EADFD3)}
.hand{position:absolute;left:50%;bottom:-6px;display:flex;align-items:flex-end;gap:7px;transform:translateX(-50%)}
.finger{position:relative;width:44px;border-radius:22px 22px 0 0;
  background:linear-gradient(90deg,#C9957A,#E9C2A8 30%,#F0CDB5 50%,#E2B497 75%,#C08B70)}
.finger:nth-child(1){height:112px;transform:rotate(-7deg);transform-origin:bottom}
.finger:nth-child(2){height:146px;transform:rotate(-2deg);transform-origin:bottom}
.finger:nth-child(3){height:158px}
.finger:nth-child(4){height:144px;transform:rotate(2.5deg);transform-origin:bottom}
.finger:nth-child(5){height:104px;width:40px;transform:rotate(8deg);transform-origin:bottom}
.nail{position:absolute;left:6px;right:6px;top:5px;height:52px;border-radius:50% 50% 42% 42%/62% 62% 36% 36%;overflow:hidden;
  box-shadow:0 1px 0 rgba(120,70,50,.35),inset 0 -3px 5px rgba(0,0,0,.18)}
.finger:nth-child(5) .nail{height:46px}
.nail .base,.nail .coat{position:absolute;inset:0}
.nail .coat{clip-path:inset(100% 0 0 0)}
.nail .coat.go{animation:brush .55s cubic-bezier(.5,.1,.3,1) forwards}
@keyframes brush{to{clip-path:inset(0 0 0 0)}}
.nail::after{content:"";position:absolute;left:18%;top:12%;width:20%;height:58%;border-radius:8px;background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,0));z-index:2}
.sheen{position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.55) 48%,transparent 58%);transform:translateX(-100%);mix-blend-mode:soft-light}
.sheen.go{animation:sheen 1.1s var(--ease) .45s}
@keyframes sheen{to{transform:translateX(100%)}}
.bottle{position:absolute;right:14px;top:16px;width:30px;height:62px;transform:rotate(6deg)}
.bottle .cap{height:26px;margin:0 7px;border-radius:3px 3px 1px 1px;background:linear-gradient(90deg,#1B1414,#4A3B38 45%,#1B1414)}
.bottle .glass{height:36px;border-radius:6px;background:var(--polish);transition:background .6s;box-shadow:inset 0 -4px 6px rgba(0,0,0,.25),inset 4px 0 0 rgba(255,255,255,.35)}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);border:1px solid var(--line);border-radius:0 0 6px 6px;background:var(--paper)}
.sw{padding:12px 2px 10px;border:0;background:none;cursor:pointer;text-align:center;font-size:.6875rem;color:var(--muted);line-height:1.2}
.sw i{display:block;width:26px;height:26px;margin:0 auto 7px;border-radius:50%;box-shadow:inset 0 -3px 5px rgba(0,0,0,.2),0 0 0 1px rgba(0,0,0,.06);transition:box-shadow .25s,transform .25s var(--ease)}
.sw:active i{transform:scale(.9)}
.sw[aria-pressed="true"]{color:var(--ink)}
.sw[aria-pressed="true"] i{box-shadow:inset 0 -3px 5px rgba(0,0,0,.2),0 0 0 2px var(--paper),0 0 0 3px var(--ink)}
.caption{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;font-size:.8125rem;color:var(--muted)}
.caption b{font-family:Cormorant,serif;font-style:italic;font-weight:500;font-size:1.15rem;color:var(--ink)}

/* =================== time =================== */
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 58px;padding:10px 0;border:1px solid var(--line);background:var(--paper);border-radius:4px;cursor:pointer;text-align:center;transition:background .25s,color .25s,transform .2s}
.day:active{transform:scale(.95)}
.day small{display:block;color:var(--muted);font-size:.6875rem;text-transform:capitalize}
.day b{font-family:Cormorant,serif;font-size:1.5rem;font-weight:500;line-height:1.2}
.day[aria-pressed="true"]{background:var(--ox);color:var(--cream);border-color:var(--ox)}
.day[aria-pressed="true"] small{color:#E9CFC6}
.day.off b{color:var(--faint)}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.slot{padding:10px 0;border:1px solid var(--line);background:var(--paper);border-radius:4px;cursor:pointer;font-size:.9375rem;font-variant-numeric:tabular-nums;transition:background .2s,color .2s,transform .2s}
.slot:not(:disabled):active{transform:scale(.94)}
.slots.anim .slot{animation:pop .3s var(--ease) both}
@keyframes pop{from{opacity:0;transform:translateY(5px)}}
.slot:disabled{background:none;color:var(--faint);text-decoration:line-through;cursor:not-allowed}
.slot[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.closed{grid-column:1/-1;padding:14px;text-align:center;color:var(--muted);font-size:.875rem;border:1px dashed var(--line);border-radius:4px}

.field{position:relative;margin-top:14px}
.field input{width:100%;padding:22px 14px 8px;border:1px solid var(--line);border-radius:4px;background:var(--paper);transition:border-color .25s}
.field label{position:absolute;left:15px;top:15px;color:var(--muted);pointer-events:none;transition:all .2s var(--ease)}
.field input:focus{border-color:var(--ox);outline:none}
.field input:focus+label,.field input:not(:placeholder-shown)+label{top:6px;font-size:.75rem;color:var(--ox)}
.check{display:flex;gap:12px;align-items:flex-start;margin-top:16px;font-size:.9375rem;cursor:pointer}
.check input{appearance:none;width:20px;height:20px;border:1px solid var(--muted);border-radius:3px;flex:none;margin-top:2px;display:grid;place-items:center;cursor:pointer;background:var(--paper);transition:background .2s}
.check input:checked{background:var(--ox);border-color:var(--ox)}
.check input:checked::after{content:"";width:5px;height:10px;border:solid var(--cream);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.check small{display:block;color:var(--muted);font-size:.8125rem}

/* =================== dock =================== */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(247,242,236,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:13px 0 calc(13px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .5s var(--ease)}
.dock.on{transform:none}
.dock .wrap{display:flex;align-items:center;gap:14px}
.dot{width:26px;height:26px;border-radius:50%;flex:none;background:var(--polish);box-shadow:inset 0 -3px 5px rgba(0,0,0,.2);transition:background .5s,opacity .3s,transform .4s var(--ease)}
.summary{flex:1;font-size:.8125rem;color:var(--muted);line-height:1.35;min-width:0}
.summary b{display:block;color:var(--ink);font-weight:500;font-size:.9375rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cta{min-width:116px;background:var(--ox);color:var(--cream);border:0;border-radius:4px;padding:14px 18px;font-weight:500;cursor:pointer;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .25s,background .25s}
.cta:not(:disabled):hover{background:var(--ox-hi)}
.cta:disabled{opacity:.35;cursor:not-allowed}
.spin{width:15px;height:15px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* =================== confirmation =================== */
.done{position:fixed;inset:0;z-index:40;display:flex;justify-content:center;padding:28px 20px;opacity:0;visibility:hidden;transition:opacity .4s,visibility .4s;overflow-y:auto;color:var(--cream);
  background-color:var(--ox-deep);background-image:
    linear-gradient(180deg,rgba(0,0,0,.15),rgba(10,2,3,.6)),
    repeating-linear-gradient(90deg,transparent 0 37px,rgba(15,2,4,.8) 37px 39px),
    repeating-linear-gradient(0deg,transparent 0 77px,rgba(15,2,4,.8) 77px 79px),
    linear-gradient(180deg,#6A1A20,#3A0D10)}
.done.on{opacity:1;visibility:visible}
.done .inner{max-width:400px;width:100%;margin:auto 0}
.card{background:var(--paper);color:var(--ink);border-radius:3px;padding:28px 22px 20px;position:relative;opacity:0;transform:translateY(60px) rotate(-4deg);box-shadow:0 30px 60px rgba(0,0,0,.4)}
.done.on .card{animation:card 1s var(--ease) .15s forwards}
@keyframes card{to{opacity:1;transform:rotate(-1deg)}}
.seal{position:absolute;right:-12px;top:-16px;width:70px;height:70px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#F3DFAE,#C49A55 45%,#8D6630);box-shadow:0 4px 10px rgba(0,0,0,.35),inset 0 0 0 4px rgba(255,255,255,.18),inset 0 0 0 5px rgba(90,60,20,.4);
  font-family:Cormorant,serif;font-size:1.6rem;font-weight:500;color:#4A3112;opacity:0;transform:scale(1.9) rotate(-30deg)}
.done.on .seal{animation:stamp .45s cubic-bezier(.3,1.5,.5,1) .95s forwards}
@keyframes stamp{to{opacity:1;transform:scale(1) rotate(12deg)}}
.card .brand{font-family:Cormorant,serif;font-weight:500;letter-spacing:.24em;font-size:.9375rem;text-align:center;padding-left:.24em}
.card .brand small{display:block;font-family:Jost,sans-serif;letter-spacing:.18em;font-size:.5625rem;color:var(--muted);margin-top:2px}
.card h3{font-family:Cormorant,serif;font-style:italic;font-weight:400;font-size:2.4rem;line-height:1.05;text-align:center;margin:18px 0 4px}
.card .sub{text-align:center;color:var(--muted);font-size:.9375rem}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line);font-size:.9375rem}
.card dt{color:var(--muted)}
.card dd{text-align:right}
.card dd i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:6px;box-shadow:inset 0 -2px 3px rgba(0,0,0,.2)}
.card .ref{display:flex;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-size:.8125rem;color:var(--muted)}
.card .ref b{font-family:Cormorant,serif;font-weight:600;font-size:1.05rem;color:var(--ink);letter-spacing:.06em}
.wa{margin-top:18px;background:#0E1A17;border-radius:10px;padding:12px;opacity:0;transform:translateY(10px)}
.done.on .wa{animation:place .5s var(--ease) 1.25s forwards}
.wa .who{font-size:.75rem;color:#8FA9A0;margin-bottom:8px}
.bubble{background:#1E3A32;color:#E8F1EE;border-radius:3px 10px 10px 10px;padding:10px 12px 18px;font-size:.875rem;line-height:1.45;position:relative;white-space:pre-line}
.bubble time{position:absolute;right:10px;bottom:4px;font-size:.6875rem;color:#8FA9A0}
.actions{display:flex;gap:10px;margin-top:16px}
.actions button{padding:12px 10px;border-radius:4px;cursor:pointer;font-size:.9375rem;white-space:nowrap}
.actions .primary{flex:1.5;background:var(--cream);color:var(--ox-deep);border:0;font-weight:500}
.actions .ghost{flex:1;background:none;border:1px solid rgba(244,228,218,.35);color:var(--cream)}

footer{margin-top:56px;color:var(--faint);font-size:.8125rem;text-align:center}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .tv,.hero-copy,.card,.wa,.seal{opacity:1;transform:none}
  .seal{transform:rotate(12deg)}
  .tube{transform:none;filter:none}
  .nail .coat{clip-path:none}
}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="light" aria-hidden="true"></div>
  <div class="floor" aria-hidden="true"></div>
  <div class="topbar">
    <small>Les Princesses, Casablanca</small>
    <div class="lang" role="group" aria-label="Langue / Language">
      <button data-lang="fr" aria-pressed="true">FR</button>
      <button data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>

  <div class="stack" id="stack">
    <div class="tv" id="tv1">
      <div class="cab">
        <div class="screen"><canvas class="static" width="64" height="46"></canvas>
          <div class="tube"><div class="pic active"><span class="logo">L'ÉCRIN</span><span class="sub">NAIL BAR</span></div></div>
        </div>
        <div class="panel" aria-hidden="true"><span class="knob" style="--r:30deg"></span><span class="knob" style="--r:-60deg"></span><span class="grille"></span></div>
      </div>
      <div class="feet" aria-hidden="true"><i></i><i></i></div>
    </div>
    <div class="tv" id="tv2">
      <div class="cab">
        <div class="screen" aria-live="polite"><canvas class="static" width="64" height="46"></canvas>
          <div class="tube">
            <div class="pic tiles active"><span class="logo" style="font-size:.85rem;letter-spacing:.3em">NAIL BAR</span></div>
            <div class="pic menu"><span class="it" data-i="chMenu"></span></div>
            <div class="pic shadech"><span class="it" data-i="chShade"></span><span class="small" id="chShadeName"></span></div>
            <div class="pic"><span class="it" data-i="chQuote"></span></div>
          </div>
        </div>
        <div class="panel"><button class="knob" id="knob" style="--r:0deg"></button><span class="knob" style="--r:45deg" aria-hidden="true"></span><span class="grille" aria-hidden="true"></span></div>
      </div>
      <div class="feet" aria-hidden="true"><i></i><i></i></div>
    </div>
    <div class="tv" id="tv3">
      <div class="cab">
        <button class="screen" id="tvBook"><canvas class="static" width="64" height="46"></canvas>
          <div class="tube"><div class="pic active"><span class="it" data-i="tvBook"></span><span class="live"><i></i><span data-i="tvLive"></span></span></div></div>
        </button>
        <div class="panel" aria-hidden="true"><span class="knob" style="--r:-20deg"></span><span class="knob" style="--r:80deg"></span><span class="grille"></span></div>
      </div>
      <div class="feet" aria-hidden="true"><i></i><i></i></div>
    </div>
  </div>

  <div class="hero-copy">
    <h1 data-i="h1"></h1>
    <p data-i="tag"></p>
  </div>
</div>

<div class="wrap">
  <div class="facts">
    <div><b data-i="f1a"></b><span data-i="f1b"></span></div>
    <div><b data-i="f2a"></b><span data-i="f2b"></span></div>
    <div><b data-i="f3a"></b><span data-i="f3b"></span></div>
  </div>

  <section id="s1">
    <h2><span class="n">01</span><span data-i="step1"></span></h2>
    <div class="cats" id="cats"><span class="pill" id="pill"></span></div>
    <div class="list" id="list"></div>
    <p class="note" data-i="sample"></p>
  </section>

  <div class="shade" id="shade"><div>
    <section style="margin-top:46px">
      <h2><span class="n">02</span><span data-i="step2"></span></h2>
      <div class="studio" aria-hidden="true">
        <div class="bottle"><div class="cap"></div><div class="glass"></div></div>
        <div class="hand" id="hand">
          <span class="finger"><span class="nail"><span class="base"></span><span class="coat"></span></span></span>
          <span class="finger"><span class="nail"><span class="base"></span><span class="coat"></span></span></span>
          <span class="finger"><span class="nail"><span class="base"></span><span class="coat"></span></span></span>
          <span class="finger"><span class="nail"><span class="base"></span><span class="coat"></span></span></span>
          <span class="finger"><span class="nail"><span class="base"></span><span class="coat"></span></span></span>
        </div>
        <div class="sheen" id="sheen"></div>
      </div>
      <div class="swatches" id="swatches" role="group"></div>
      <div class="caption"><span data-i="shadeHint"></span><b id="shadeName"></b></div>
    </section>
  </div></div>

  <section>
    <h2><span class="n" id="nTime">02</span><span data-i="step3"></span></h2>
    <div class="days" id="days"></div>
    <div class="slots" id="slots"></div>
  </section>

  <section>
    <h2><span class="n" id="nDetails">03</span><span data-i="step4"></span></h2>
    <div class="field"><input id="name" autocomplete="name" placeholder=" "><label for="name" data-i="name"></label></div>
    <div class="field"><input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder=" "><label for="phone" data-i="phone"></label></div>
    <label class="check"><input type="checkbox" id="club"><span><span data-i="club"></span><small data-i="clubSub"></small></span></label>
  </section>

  <footer data-i="footer"></footer>
</div>

<div class="dock" id="dock">
  <div class="wrap">
    <span class="dot" id="dot" aria-hidden="true"></span>
    <div class="summary" id="summary"></div>
    <button class="cta" id="book" disabled><span data-i="book"></span></button>
  </div>
</div>

<div class="done" id="done" role="dialog" aria-modal="true" aria-labelledby="doneTitle">
  <div class="inner">
    <div class="card">
      <span class="seal" aria-hidden="true">É</span>
      <div class="brand">L'ÉCRIN<small>NAIL BAR</small></div>
      <h3 id="doneTitle" data-i="booked"></h3>
      <p class="sub" data-i="bookedSub"></p>
      <dl id="details"></dl>
      <div class="ref"><span data-i="refLabel"></span><b id="ref"></b></div>
    </div>
    <div class="wa">
      <div class="who" data-i="waFrom"></div>
      <div class="bubble" id="bubble"></div>
    </div>
    <div class="actions">
      <button class="primary" id="ics" data-i="calendar"></button>
      <button class="ghost" id="again" data-i="again"></button>
    </div>
  </div>
</div>

<script>
const SHADES=[
  {id:"choc",c:"#4A2318",fr:"Chocolat",en:"Chocolate"},
  {id:"ox",c:"#5A161B",fr:"Bordeaux",en:"Oxblood"},
  {id:"cherry",c:"#9E1B23",fr:"Cerise",en:"Cherry"},
  {id:"nude",c:"#D3AC95",fr:"Nude",en:"Nude"},
  {id:"milk",c:"#EFE6DC",fr:"Lait",en:"Milky"},
  {id:"noir",c:"#1C1416",fr:"Noir",en:"Black"}
];
const SVC={
  mains:[{id:"semi",p:250,m:60,color:1},{id:"classic",p:150,m:40,color:1},{id:"gel",p:400,m:90,color:1},{id:"remove",p:80,m:20,color:0}],
  pieds:[{id:"pedi",p:300,m:60,color:1},{id:"pedispa",p:400,m:75,color:1}],
  regard:[{id:"lash",p:350,m:60,color:0},{id:"brow",p:250,m:45,color:0},{id:"tint",p:120,m:20,color:0}]
};
const T={
  fr:{
    locale:"fr-FR",
    tvBook:"Réservez votre moment",tvLive:"Rendez-vous ouverts",knob:"Changer de chaîne",
    chMenu:"Manucure\nPédicure\nRegard",chShade:"Teinte du jour",chQuote:"Prendre le temps.",
    h1:"Prendre le temps.",tag:"Manucure, pédicure et beauté du regard, dans un écrin pensé pour vous.",
    f1a:"Mar – Dim",f1b:"10 h – 20 h",f2a:"Self-care club",f2b:"Avantages membres",f3a:"WhatsApp",f3b:"Confirmation immédiate",
    step1:"Votre soin",step2:"Votre teinte",step3:"Votre moment",step4:"Vos coordonnées",
    cats:{mains:"Mains",pieds:"Pieds",regard:"Regard"},
    sample:"Maquette : prestations, tarifs et horaires donnés à titre d'exemple.",
    shadeHint:"Teinte choisie",
    name:"Nom complet",phone:"Numéro WhatsApp",
    club:"Je souhaite rejoindre le club",clubSub:"On vous présente les avantages membres lors de votre visite.",
    footer:"Maquette conçue par System Unity. Contenus donnés à titre d'exemple.",
    book:"Réserver",busy:"Un instant…",booked:"À très vite.",bookedSub:"Votre rendez-vous est confirmé.",
    refLabel:"Référence",waFrom:"L'Écrin Nail Bar, sur WhatsApp",calendar:"Ajouter au calendrier",again:"Retour",
    dSvc:"Soin",dShade:"Teinte",dDate:"Date",dTime:"Heure",dPrice:"Total",
    pickTime:"Choisissez un jour et une heure",closed:"Fermé le lundi. Choisissez un autre jour.",
    wa:(n,s,d,t,r,sh)=>`Bonjour ${n},\nVotre rendez-vous ${s}${sh?` (teinte ${sh})`:""} est confirmé pour ${d} à ${t}.\nRéférence ${r}\n\nL'Écrin, Les Princesses, Casablanca. Sonnez à l'entrée, on vous attend.`,
    svc:{semi:["Manucure semi-permanent","Préparation, soin des cuticules et vernis, 60 min"],classic:["Manucure classique","Mise en forme et vernis, 40 min"],gel:["Pose gel","Extension et finition, 90 min"],remove:["Dépose","Retrait en douceur, 20 min"],
      pedi:["Pédicure semi-permanent","Soin complet et vernis, 60 min"],pedispa:["Pédicure spa","Bain, gommage, massage et vernis, 75 min"],
      lash:["Rehaussement de cils","Avec teinture, 60 min"],brow:["Restructuration sourcils","Brow lamination, 45 min"],tint:["Teinture sourcils","20 min"]}
  },
  en:{
    locale:"en-GB",
    tvBook:"Book your moment",tvLive:"Now booking",knob:"Change channel",
    chMenu:"Manicure\nPedicure\nLashes & brows",chShade:"Shade of the day",chQuote:"Take your time.",
    h1:"Take your time.",tag:"Manicure, pedicure and lash & brow care, in a space designed around you.",
    f1a:"Tue – Sun",f1b:"10am – 8pm",f2a:"Self-care club",f2b:"Member perks",f3a:"WhatsApp",f3b:"Instant confirmation",
    step1:"Your treatment",step2:"Your shade",step3:"Your moment",step4:"Your details",
    cats:{mains:"Hands",pieds:"Feet",regard:"Lashes & brows"},
    sample:"Mockup: treatments, prices and hours are examples.",
    shadeHint:"Chosen shade",
    name:"Full name",phone:"WhatsApp number",
    club:"I'd like to join the club",clubSub:"We'll walk you through member perks on your visit.",
    footer:"Mockup designed by System Unity. Content shown as examples.",
    book:"Book",busy:"One moment…",booked:"See you soon.",bookedSub:"Your appointment is confirmed.",
    refLabel:"Reference",waFrom:"L'Écrin Nail Bar, on WhatsApp",calendar:"Add to calendar",again:"Back",
    dSvc:"Treatment",dShade:"Shade",dDate:"Date",dTime:"Time",dPrice:"Total",
    pickTime:"Pick a day and time",closed:"Closed on Mondays. Pick another day.",
    wa:(n,s,d,t,r,sh)=>`Hi ${n},\nYour ${s} appointment${sh?` (shade: ${sh})`:""} is confirmed for ${d} at ${t}.\nReference ${r}\n\nL'Écrin, Les Princesses, Casablanca. Ring at the door, we'll be expecting you.`,
    svc:{semi:["Gel polish manicure","Prep, cuticle care and polish, 60 min"],classic:["Classic manicure","Shaping and polish, 40 min"],gel:["Gel extensions","Build and finish, 90 min"],remove:["Removal","Gentle soak-off, 20 min"],
      pedi:["Gel polish pedicure","Full care and polish, 60 min"],pedispa:["Spa pedicure","Soak, scrub, massage and polish, 75 min"],
      lash:["Lash lift","With tint, 60 min"],brow:["Brow lamination","Shape and set, 45 min"],tint:["Brow tint","20 min"]}
  }
};
const TIMES=["10:00","11:00","12:00","13:30","15:00","16:00","17:30","18:30"];
const state={lang:"fr",cat:"mains",svc:null,shade:"choc",day:null,time:null,ch:0};
const $=id=>document.getElementById(id);
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const days=[...Array(12)].map((_,i)=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+i);return d});
state.day=days.findIndex(d=>d.getDay()!==1);
try{const s=localStorage.getItem("lecrin-lang");if(s&&T[s])state.lang=s}catch(e){}

const fr=s=>state.lang==="fr"?s.replace(/ ([?!:;])/g," $1"):s;
const longDate=(d,L)=>d.toLocaleDateString(L.locale,{weekday:"long",day:"numeric",month:"long"});
const find=id=>Object.values(SVC).flat().find(s=>s.id===id);
const shade=()=>SHADES.find(s=>s.id===state.shade);
const needsColor=()=>state.svc&&find(state.svc).color;
const taken=(day,i)=>((days[day].getDate()*7+i*13)%9)<3;

/* ---------- TV static ---------- */
function staticBurst(tv,ms=260){
  if(reduce)return;
  const c=tv.querySelector(".static"),x=c.getContext("2d"),img=x.createImageData(c.width,c.height),t0=performance.now();
  c.style.opacity=1;
  (function f(t){
    for(let i=0;i<img.data.length;i+=4){const v=Math.random()*255;img.data[i]=v;img.data[i+1]=v*.92;img.data[i+2]=v*.9;img.data[i+3]=255}
    x.putImageData(img,0,0);
    if(t-t0<ms)requestAnimationFrame(f);else c.style.opacity=0;
  })(t0);
}
function setChannel(n){
  const tv=$("tv2"),pics=tv.querySelectorAll(".pic");
  state.ch=(n+pics.length)%pics.length;
  staticBurst(tv,240);
  setTimeout(()=>pics.forEach((p,i)=>p.classList.toggle("active",i===state.ch)),110);
  const k=$("knob");k.style.setProperty("--r",(state.ch*72)+"deg");
}
let chTimer;
function autoChannels(){clearInterval(chTimer);if(!reduce)chTimer=setInterval(()=>setChannel(state.ch+1),3600)}
$("knob").onclick=()=>{setChannel(state.ch+1);autoChannels()};
$("tvBook").onclick=()=>{staticBurst($("tv3"),220);setTimeout(()=>$("s1").scrollIntoView({behavior:reduce?"auto":"smooth"}),180)};

/* ---------- render ---------- */
function movePill(){
  const b=document.querySelector(`.cat[aria-pressed="true"]`),p=$("pill");if(!b)return;
  p.style.width=b.offsetWidth+"px";p.style.transform=`translateX(${b.offsetLeft}px)`;
}
function renderStatic(){
  const L=T[state.lang];
  document.documentElement.lang=state.lang;
  document.querySelectorAll("[data-i]").forEach(el=>{el.textContent=fr(L[el.dataset.i])});
  document.querySelectorAll(".pic.menu .it").forEach(el=>{el.innerHTML=L.chMenu.replace(/\n/g,"<br>")});
  $("knob").setAttribute("aria-label",L.knob);
  $("tvBook").setAttribute("aria-label",L.tvBook);
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===state.lang));
  $("cats").querySelectorAll(".cat").forEach(b=>b.remove());
  $("cats").insertAdjacentHTML("beforeend",Object.keys(SVC).map(c=>`<button class="cat" data-cat="${c}" aria-pressed="${state.cat===c}">${L.cats[c]}</button>`).join(""));
  requestAnimationFrame(movePill);
  $("swatches").setAttribute("aria-label",L.step2);
}
function renderList(anim){
  const L=T[state.lang],el=$("list");
  el.innerHTML=SVC[state.cat].map((s,i)=>{const [t,d]=L.svc[s.id];return `<button class="svc" style="animation-delay:${i*45}ms" data-s="${s.id}" aria-pressed="${state.svc===s.id}"><span class="t">${t}</span><span class="d">${d}</span><span class="p">${s.p}<small>MAD</small></span></button>`}).join("");
  if(anim){el.classList.remove("anim");void el.offsetWidth;el.classList.add("anim")}
}
let prevShade=SHADES[0].c;
function paintNails(newC,animate){
  document.querySelectorAll(".nail").forEach((n,i)=>{
    const base=n.querySelector(".base"),coat=n.querySelector(".coat");
    if(!animate||reduce){base.style.background=newC;coat.style.background=newC;coat.classList.remove("go");coat.style.clipPath="none";return}
    base.style.background=prevShade;coat.style.background=newC;coat.style.clipPath="";
    coat.classList.remove("go");void coat.offsetWidth;coat.style.animationDelay=(i*85)+"ms";coat.classList.add("go");
  });
  const sh=$("sheen");if(animate&&!reduce){sh.classList.remove("go");void sh.offsetWidth;sh.classList.add("go")}
  prevShade=newC;
}
function renderShade(animate){
  const L=T[state.lang],sh=shade();
  $("shade").classList.toggle("on",!!needsColor());
  $("nTime").textContent=needsColor()?"03":"02";
  $("nDetails").textContent=needsColor()?"04":"03";
  $("swatches").innerHTML=SHADES.map(s=>`<button class="sw" data-sh="${s.id}" aria-pressed="${state.shade===s.id}"><i style="background:${s.c}"></i>${s[state.lang]}</button>`).join("");
  document.documentElement.style.setProperty("--polish",sh.c);
  $("shadeName").textContent=sh[state.lang];
  $("chShadeName").textContent=sh[state.lang];
  paintNails(sh.c,animate);
}
function renderDays(){
  const L=T[state.lang];
  $("days").innerHTML=days.map((d,i)=>`<button class="day${d.getDay()===1?" off":""}" data-d="${i}" aria-pressed="${state.day===i}"><small>${d.toLocaleDateString(L.locale,{weekday:"short"}).replace(".","")}</small><b>${d.getDate()}</b></button>`).join("");
}
function renderSlots(anim){
  const L=T[state.lang],el=$("slots");
  if(days[state.day].getDay()===1){el.innerHTML=`<p class="closed">${L.closed}</p>`;return}
  el.innerHTML=TIMES.map((t,i)=>`<button class="slot" style="animation-delay:${i*30}ms" data-t="${t}" ${taken(state.day,i)?"disabled":""} aria-pressed="${state.time===t}">${t}</button>`).join("");
  if(anim){el.classList.remove("anim");void el.offsetWidth;el.classList.add("anim")}
}
function ready(){return state.svc&&state.time&&$("name").value.trim().length>1&&$("phone").value.replace(/\D/g,"").length>=9}
function renderDock(){
  const L=T[state.lang];
  $("dock").classList.toggle("on",!!state.svc);
  $("dot").style.opacity=needsColor()?1:0;
  if(state.svc){
    const s=find(state.svc),when=state.time?`${longDate(days[state.day],L)}, ${state.time}`:L.pickTime;
    $("summary").innerHTML=`<b>${L.svc[state.svc][0]} · ${s.p} MAD</b>${fr(when)}`;
  }
  $("book").disabled=!ready();
}
function renderAll(){renderStatic();renderList(false);renderShade(false);renderDays();renderSlots(false);renderDock()}

document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.lang){state.lang=b.dataset.lang;try{localStorage.setItem("lecrin-lang",state.lang)}catch(e){};renderAll()}
  else if(b.dataset.cat){state.cat=b.dataset.cat;$("cats").querySelectorAll(".cat").forEach(c=>c.setAttribute("aria-pressed",c===b));movePill();renderList(true)}
  else if(b.dataset.s){const had=needsColor();state.svc=b.dataset.s;renderList(false);renderShade(!had&&!!needsColor());renderDock()}
  else if(b.dataset.sh){if(state.shade===b.dataset.sh)return;state.shade=b.dataset.sh;renderShade(true);renderDock();
    const d=$("dot");d.animate?.([{transform:"scale(1.25)"},{transform:"scale(1)"}],{duration:400,easing:"cubic-bezier(.2,.75,.2,1)"})}
  else if(b.dataset.d){state.day=+b.dataset.d;state.time=null;renderDays();renderSlots(true);renderDock()}
  else if(b.dataset.t){state.time=b.dataset.t;renderSlots(false);renderDock()}
});
["name","phone"].forEach(id=>$(id).addEventListener("input",()=>{$("book").disabled=!ready()}));
addEventListener("resize",movePill);

$("book").onclick=()=>{
  const L=T[state.lang],btn=$("book");
  btn.innerHTML=`<span class="spin"></span><span>${L.busy}</span>`;btn.disabled=true;
  setTimeout(()=>{
    state.ref="LE-"+String(Math.floor(1000+Math.random()*9000));
    const s=find(state.svc),name=L.svc[state.svc][0],d=longDate(days[state.day],L),sh=needsColor()?shade():null;
    const rows=[[L.dSvc,name]];
    if(sh)rows.push([L.dShade,`<i style="background:${sh.c}"></i>${sh[state.lang]}`]);
    rows.push([L.dDate,d],[L.dTime,state.time],[L.dPrice,s.p+" MAD"]);
    $("details").innerHTML=rows.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join("");
    $("ref").textContent=state.ref;
    $("bubble").textContent=fr(L.wa($("name").value.trim().split(/\s+/)[0],name,d,state.time,state.ref,sh?sh[state.lang]:""));
    $("bubble").insertAdjacentHTML("beforeend",`<time>${new Date().toLocaleTimeString(L.locale,{hour:"2-digit",minute:"2-digit"})}</time>`);
    $("done").scrollTop=0;$("done").classList.add("on");
    btn.innerHTML=`<span>${L.book}</span>`;btn.disabled=!ready();
    setTimeout(()=>$("ics").focus({preventScroll:true}),60);
  },reduce?0:900);
};
$("ics").onclick=()=>{
  const L=T[state.lang],[h,m]=state.time.split(":").map(Number);
  const st=new Date(days[state.day]);st.setHours(h,m);
  const en=new Date(st.getTime()+find(state.svc).m*60000);
  const f=d=>d.toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//L'Ecrin Nail Bar//Booking//FR","BEGIN:VEVENT",
    `UID:${state.ref}@lecrin`,`DTSTAMP:${f(new Date())}`,`DTSTART:${f(st)}`,`DTEND:${f(en)}`,
    `SUMMARY:L'Écrin — ${L.svc[state.svc][0]}`,"LOCATION:Les Princesses\\, Casablanca",`DESCRIPTION:${L.refLabel} ${state.ref}`,
    "END:VEVENT","END:VCALENDAR"].join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([ics],{type:"text/calendar"}));
  a.download=`lecrin-${state.ref}.ics`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
$("again").onclick=()=>{$("done").classList.remove("on");state.svc=null;state.time=null;renderList(false);renderShade(false);renderSlots(false);renderDock();window.scrollTo({top:0,behavior:reduce?"auto":"smooth"})};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("done").classList.contains("on"))$("again").click()});

/* ---------- opening: TVs placed, then switched on top to bottom ---------- */
renderAll();
const stage=$("stage");
requestAnimationFrame(()=>stage.classList.add("ready"));
const order=["tv1","tv2","tv3"];
order.forEach((id,i)=>setTimeout(()=>{const tv=$(id);tv.classList.add("on");staticBurst(tv,180)},reduce?0:900+i*380));
setTimeout(()=>{stage.classList.add("powered");autoChannels()},reduce?0:2200);

/* light parallax on the stack while scrolling the hero */
if(!reduce){let tick=false;addEventListener("scroll",()=>{if(tick)return;tick=true;requestAnimationFrame(()=>{const y=Math.min(scrollY,700);$("stack").style.transform=`translateY(${y*.18}px)`;tick=false})},{passive:true})}
</script>
</body>
</html>
